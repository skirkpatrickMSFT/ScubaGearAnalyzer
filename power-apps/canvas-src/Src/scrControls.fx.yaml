scrControls As screen:
    Fill: =RGBA(255, 255, 255, 1)
    OnVisible: |-
        =Set(varSelectedProduct, "All");
        Set(varSelectedStatus, "All");
        ClearCollect(colFilteredControls, colControls)

    rectHeader2 As rectangle:
        X: =0
        Y: =0
        Width: =1366
        Height: =60
        Fill: =RGBA(0, 120, 212, 1)

    lblHeader2 As label:
        X: =20
        Y: =10
        Width: =300
        Height: =40
        Text: ="Controls Detail"
        Size: =20
        FontWeight: =FontWeight.Bold
        Color: =RGBA(255, 255, 255, 1)

    btnNavDashboard As button:
        X: =900
        Y: =10
        Width: =140
        Height: =40
        Text: ="Dashboard"
        Fill: =RGBA(0, 90, 158, 1)
        Color: =RGBA(255, 255, 255, 1)
        OnSelect: =Navigate(scrUpload)

    btnNavChat2 As button:
        X: =1200
        Y: =10
        Width: =140
        Height: =40
        Text: ="Chat"
        Fill: =RGBA(0, 90, 158, 1)
        Color: =RGBA(255, 255, 255, 1)
        OnSelect: =Navigate(scrChat)

    drpProduct As dropdown:
        X: =20
        Y: =75
        Width: =200
        Height: =40
        Items: =["All", "AAD", "DEFENDER", "EXO", "SHAREPOINT", "TEAMS", "POWERPLATFORM", "POWERBI"]
        Default: ="All"
        OnChange: |-
            =Set(varSelectedProduct, Self.Selected.Value);
            ClearCollect(
                colFilteredControls,
                Filter(
                    colControls,
                    (varSelectedProduct = "All" || product = varSelectedProduct) &&
                    (varSelectedStatus = "All" || status = varSelectedStatus)
                )
            )

    drpStatus As dropdown:
        X: =240
        Y: =75
        Width: =200
        Height: =40
        Items: =["All", "Pass", "Fail", "Not-Implemented", "3rd Party", "Omitted"]
        Default: ="All"
        OnChange: |-
            =Set(varSelectedStatus, Self.Selected.Value);
            ClearCollect(
                colFilteredControls,
                Filter(
                    colControls,
                    (varSelectedProduct = "All" || product = varSelectedProduct) &&
                    (varSelectedStatus = "All" || status = varSelectedStatus)
                )
            )

    lblControlCount As label:
        X: =460
        Y: =80
        Width: =200
        Height: =30
        Text: =CountRows(colFilteredControls) & " controls"
        Size: =13
        Color: =RGBA(169, 169, 169, 1)

    rectGalControlsPlaceholder As rectangle:
        X: =20
        Y: =125
        Width: =850
        Height: =620
        Fill: =RGBA(245, 245, 245, 1)
        BorderColor: =RGBA(211, 211, 211, 1)
        BorderThickness: =1

    lblGalControlsHint As label:
        X: =30
        Y: =400
        Width: =830
        Height: =40
        Text: ="DELETE this rectangle and hint label, then Insert a Blank Vertical Gallery here (see README Steps 21)"
        Size: =11
        Color: =RGBA(169, 169, 169, 1)
        Align: =Align.Center

    rectDetailPanel As rectangle:
        X: =880
        Y: =60
        Width: =486
        Height: =708
        Fill: =RGBA(255, 255, 255, 0.97)
        BorderColor: =RGBA(211, 211, 211, 1)
        BorderThickness: =1
        Visible: =varShowDetail

    icoCloseDetail As icon.Cancel:
        X: =1330
        Y: =65
        Width: =30
        Height: =30
        OnSelect: =Set(varShowDetail, false)
        Visible: =varShowDetail
        Color: =RGBA(169, 169, 169, 1)

    lblDetailId As label:
        X: =895
        Y: =70
        Width: =400
        Height: =35
        Text: =If(varShowDetail, varSelectedControl.controlId, "")
        Size: =20
        FontWeight: =FontWeight.Bold
        Visible: =varShowDetail

    lblDetailStatus As label:
        X: =895
        Y: =110
        Width: =200
        Height: =25
        Text: =If(varShowDetail, "Status: " & varSelectedControl.status, "")
        Size: =13
        Color: =Switch(varSelectedControl.status, "Pass", RGBA(16, 124, 16, 1), "Fail", RGBA(209, 52, 56, 1), RGBA(128, 128, 128, 1))
        Visible: =varShowDetail

    lblDetailCriticality As label:
        X: =895
        Y: =140
        Width: =200
        Height: =25
        Text: =If(varShowDetail, "Criticality: " & varSelectedControl.criticality, "")
        Size: =13
        Visible: =varShowDetail

    lblDetailReport As label:
        X: =895
        Y: =175
        Width: =450
        Height: =150
        Text: =If(varShowDetail, varSelectedControl.reportDetails, "")
        Size: =12
        Color: =RGBA(169, 169, 169, 1)
        Visible: =varShowDetail

    btnRemediation As button:
        X: =895
        Y: =340
        Width: =220
        Height: =40
        Text: ="Get Remediation Steps"
        Fill: =RGBA(0, 120, 212, 1)
        Color: =RGBA(255, 255, 255, 1)
        Visible: =varShowDetail
        OnSelect: =Set(varRemediation, APIScubaGearAnalyzer.GetRemediation({controlId: varSelectedControl.controlId}))

    lblRemediation As label:
        X: =895
        Y: =390
        Width: =450
        Height: =250
        Text: =If(!IsBlank(varRemediation), varRemediation.implementation, "")
        Size: =11
        Color: =RGBA(169, 169, 169, 1)
        Visible: =varShowDetail

    btnViewDocs As button:
        X: =1130
        Y: =340
        Width: =220
        Height: =40
        Text: ="View MS Learn Docs"
        Fill: =RGBA(16, 124, 16, 1)
        Color: =RGBA(255, 255, 255, 1)
        Visible: =varShowDetail
        OnSelect: =Set(varControlDocs, APIScubaGearAnalyzer.GetControlDocs({controlId: varSelectedControl.controlId}))
