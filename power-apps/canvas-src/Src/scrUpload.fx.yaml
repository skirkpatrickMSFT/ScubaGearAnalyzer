scrUpload As screen:
    Fill: =RGBA(255, 255, 255, 1)

    rectHeader As rectangle:
        X: =0
        Y: =0
        Width: =1366
        Height: =60
        Fill: =RGBA(0, 120, 212, 1)

    lblTitle As label:
        X: =20
        Y: =10
        Width: =400
        Height: =40
        Text: ="ScubaGear Analyzer"
        Size: =20
        FontWeight: =FontWeight.Bold
        Color: =RGBA(255, 255, 255, 1)

    btnModePaste As button:
        X: =20
        Y: =70
        Width: =160
        Height: =36
        Text: ="Paste JSON"
        Fill: =If(varUploadMode = "paste", RGBA(0, 120, 212, 1), RGBA(230, 230, 230, 1))
        Color: =If(varUploadMode = "paste", RGBA(255, 255, 255, 1), RGBA(50, 50, 50, 1))
        OnSelect: =Set(varUploadMode, "paste")
        BorderColor: =RGBA(0, 120, 212, 1)
        BorderThickness: =1
        RadiusTopLeft: =4
        RadiusBottomLeft: =4
        RadiusTopRight: =0
        RadiusBottomRight: =0

    btnModeStorage As button:
        X: =180
        Y: =70
        Width: =200
        Height: =36
        Text: ="Load from Storage"
        Fill: =If(varUploadMode = "storage", RGBA(0, 120, 212, 1), RGBA(230, 230, 230, 1))
        Color: =If(varUploadMode = "storage", RGBA(255, 255, 255, 1), RGBA(50, 50, 50, 1))
        OnSelect: =Set(varUploadMode, "storage")
        BorderColor: =RGBA(0, 120, 212, 1)
        BorderThickness: =1
        RadiusTopLeft: =0
        RadiusBottomLeft: =0
        RadiusTopRight: =4
        RadiusBottomRight: =4

    txtJsonInput As text:
        X: =20
        Y: =120
        Width: =660
        Height: =260
        Mode: =TextMode.MultiLine
        HintText: ="Paste your ScubaGear TestResults.json content here..."
        Size: =11
        Visible: =varUploadMode = "paste"

    btnParse As button:
        X: =20
        Y: =390
        Width: =200
        Height: =40
        Text: ="Analyse Results"
        Visible: =varUploadMode = "paste"
        OnSelect: |-
            =Set(
                varResults,
                APIScubaGearAnalyzer.ParseResults(
                    ParseJSON(txtJsonInput.Text)
                )
            );
            ClearCollect(colProducts, varResults.productBreakdown);
            ClearCollect(colControls, varResults.controls);
            Set(varChatContext, varResults.chatContext);
            Set(varExclusionContext, varResults.exclusionContext);
            Set(varIsLoaded, true)

    lblStorageAccount As label:
        X: =20
        Y: =120
        Width: =150
        Height: =30
        Text: ="Storage Account:"
        Size: =11
        Visible: =varUploadMode = "storage"

    txtStorageAccount As text:
        X: =170
        Y: =120
        Width: =300
        Height: =30
        HintText: ="e.g. scubaconnectstorage"
        Size: =11
        Visible: =varUploadMode = "storage"
        Default: =varStorageAccountName

    lblContainer As label:
        X: =20
        Y: =158
        Width: =150
        Height: =30
        Text: ="Container Name:"
        Size: =11
        Visible: =varUploadMode = "storage"

    txtContainer As text:
        X: =170
        Y: =158
        Width: =300
        Height: =30
        HintText: ="e.g. scubagear-output"
        Size: =11
        Visible: =varUploadMode = "storage"
        Default: =varContainerName

    lblSasToken As label:
        X: =20
        Y: =196
        Width: =150
        Height: =30
        Text: ="SAS Token:"
        Size: =11
        Visible: =varUploadMode = "storage" && !varUseManagedIdentity

    txtSasToken As text:
        X: =170
        Y: =196
        Width: =510
        Height: =30
        HintText: ="?sv=2023-01-03&ss=b&srt=co&sp=rl&se=..."
        Size: =9
        Visible: =varUploadMode = "storage" && !varUseManagedIdentity
        Default: =varSasToken

    lblAuthMethod As label:
        X: =20
        Y: =196
        Width: =200
        Height: =30
        Text: ="Using Managed Identity ✓"
        Size: =11
        FontWeight: =FontWeight.Semibold
        Color: =RGBA(16, 124, 16, 1)
        Visible: =varUploadMode = "storage" && varUseManagedIdentity

    tglAuthMethod As toggleSwitch:
        X: =490
        Y: =158
        Width: =190
        Height: =30
        Label: ="Managed Identity"
        Size: =10
        Default: =varUseManagedIdentity
        Visible: =varUploadMode = "storage"
        OnChange: =Set(varUseManagedIdentity, Self.Checked)

    btnSaveSettings As button:
        X: =510
        Y: =120
        Width: =170
        Height: =30
        Text: ="Save Settings"
        Fill: =RGBA(230, 230, 230, 1)
        Color: =RGBA(50, 50, 50, 1)
        Size: =10
        Visible: =varUploadMode = "storage"
        OnSelect: |-
            =Set(varStorageAccountName, txtStorageAccount.Text);
            Set(varContainerName, txtContainer.Text);
            Set(varSasToken, txtSasToken.Text);
            SaveData(
                Table({
                    account: txtStorageAccount.Text,
                    container: txtContainer.Text,
                    sas: txtSasToken.Text,
                    useMI: varUseManagedIdentity
                }),
                "ScubaStorageSettings"
            );
            Notify("Storage settings saved", NotificationType.Success)

    lblPrefix As label:
        X: =20
        Y: =240
        Width: =150
        Height: =30
        Text: ="Path Prefix:"
        Size: =11
        Visible: =varUploadMode = "storage"

    txtPrefix As text:
        X: =170
        Y: =240
        Width: =300
        Height: =30
        HintText: ="e.g. 2026/02/ (optional)"
        Size: =11
        Visible: =varUploadMode = "storage"

    btnListBlobs As button:
        X: =490
        Y: =240
        Width: =190
        Height: =36
        Text: ="Browse Files"
        Fill: =RGBA(0, 120, 212, 1)
        Color: =RGBA(255, 255, 255, 1)
        Visible: =varUploadMode = "storage"
        OnSelect: |-
            =Set(varBlobResult, APIScubaGearAnalyzer.ListBlobs(txtStorageAccount.Text, txtContainer.Text, If(varUseManagedIdentity, Blank(), txtSasToken.Text)));
            ClearCollect(colBlobs, varBlobResult.blobs)

    lblBlobCount As label:
        X: =20
        Y: =284
        Width: =660
        Height: =24
        Text: =If(!IsEmpty(colBlobs), CountRows(colBlobs) & " result file(s) found", "")
        Size: =11
        Color: =RGBA(100, 100, 100, 1)
        Visible: =varUploadMode = "storage"

    rectGalBlobsPlaceholder As rectangle:
        X: =20
        Y: =310
        Width: =660
        Height: =70
        Fill: =RGBA(245, 245, 245, 1)
        BorderColor: =RGBA(211, 211, 211, 1)
        BorderThickness: =1
        Visible: =varUploadMode = "storage"

    lblGalBlobsHint As label:
        X: =30
        Y: =320
        Width: =640
        Height: =40
        Text: ="DELETE this rectangle and hint label, then Insert a Blank Vertical Gallery here named galBlobs (see README Step H)"
        Size: =10
        Color: =RGBA(169, 169, 169, 1)
        Align: =Align.Center
        Visible: =varUploadMode = "storage"

    btnLoadBlob As button:
        X: =20
        Y: =390
        Width: =200
        Height: =40
        Text: ="Load Selected"
        Visible: =varUploadMode = "storage" && CountRows(colBlobs) > 0
        OnSelect: |-
            =Set(varResults, APIScubaGearAnalyzer.FetchBlob(txtStorageAccount.Text, txtContainer.Text, If(varUseManagedIdentity, Blank(), txtSasToken.Text), galBlobs.Selected.name));
            ClearCollect(colProducts, varResults.productBreakdown);
            ClearCollect(colControls, varResults.controls);
            Set(varChatContext, varResults.chatContext);
            Set(varExclusionContext, varResults.exclusionContext);
            Set(varIsLoaded, true)

    rectCardTotal As rectangle:
        X: =20
        Y: =450
        Width: =150
        Height: =90
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(211, 211, 211, 1)
        BorderThickness: =1

    lblCardTotalTitle As label:
        X: =30
        Y: =455
        Width: =130
        Height: =25
        Text: ="Total"
        Size: =12
        Color: =RGBA(0, 0, 139, 1)

    lblCardTotalValue As label:
        X: =30
        Y: =480
        Width: =130
        Height: =50
        Text: =If(varIsLoaded, Text(varResults.summary.total), "—")
        Size: =28
        FontWeight: =FontWeight.Bold
        Color: =RGBA(0, 0, 139, 1)

    rectCardPass As rectangle:
        X: =180
        Y: =450
        Width: =150
        Height: =90
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(211, 211, 211, 1)
        BorderThickness: =1

    lblCardPassTitle As label:
        X: =190
        Y: =455
        Width: =130
        Height: =25
        Text: ="Pass"
        Size: =12
        Color: =RGBA(16, 124, 16, 1)

    lblCardPassValue As label:
        X: =190
        Y: =480
        Width: =130
        Height: =50
        Text: =If(varIsLoaded, Text(varResults.summary.pass), "—")
        Size: =28
        FontWeight: =FontWeight.Bold
        Color: =RGBA(16, 124, 16, 1)

    rectCardFail As rectangle:
        X: =340
        Y: =450
        Width: =150
        Height: =90
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(211, 211, 211, 1)
        BorderThickness: =1

    lblCardFailTitle As label:
        X: =350
        Y: =455
        Width: =130
        Height: =25
        Text: ="Fail"
        Size: =12
        Color: =RGBA(209, 52, 56, 1)

    lblCardFailValue As label:
        X: =350
        Y: =480
        Width: =130
        Height: =50
        Text: =If(varIsLoaded, Text(varResults.summary.fail), "—")
        Size: =28
        FontWeight: =FontWeight.Bold
        Color: =RGBA(209, 52, 56, 1)

    rectCardManual As rectangle:
        X: =500
        Y: =450
        Width: =150
        Height: =90
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(211, 211, 211, 1)
        BorderThickness: =1

    lblCardManualTitle As label:
        X: =510
        Y: =455
        Width: =130
        Height: =25
        Text: ="Manual"
        Size: =12
        Color: =RGBA(255, 140, 0, 1)

    lblCardManualValue As label:
        X: =510
        Y: =480
        Width: =130
        Height: =50
        Text: =If(varIsLoaded, Text(varResults.summary.manual), "—")
        Size: =28
        FontWeight: =FontWeight.Bold
        Color: =RGBA(255, 140, 0, 1)

    rectCardRate As rectangle:
        X: =660
        Y: =450
        Width: =150
        Height: =90
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(211, 211, 211, 1)
        BorderThickness: =1

    lblCardRateTitle As label:
        X: =670
        Y: =455
        Width: =130
        Height: =25
        Text: ="Pass Rate"
        Size: =12
        Color: =RGBA(0, 0, 139, 1)

    lblCardRateValue As label:
        X: =670
        Y: =480
        Width: =130
        Height: =50
        Text: =If(varIsLoaded, Text(varResults.summary.overallPassRate) & "%", "—")
        Size: =28
        FontWeight: =FontWeight.Bold
        Color: =If(varIsLoaded && varResults.summary.overallPassRate >= 80, RGBA(16, 124, 16, 1), RGBA(209, 52, 56, 1))

    rectGauge As rectangle:
        X: =700
        Y: =80
        Width: =300
        Height: =300
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(211, 211, 211, 1)
        BorderThickness: =1

    lblGaugeTitle As label:
        X: =720
        Y: =100
        Width: =260
        Height: =30
        Text: ="Overall Pass Rate"
        Align: =Align.Center
        Size: =14

    lblGaugeValue As label:
        X: =720
        Y: =160
        Width: =260
        Height: =80
        Text: =If(varIsLoaded, Text(varResults.summary.overallPassRate) & "%", "—")
        Align: =Align.Center
        Size: =48
        FontWeight: =FontWeight.Bold
        Color: =If(varIsLoaded && varResults.summary.overallPassRate >= 80, RGBA(16, 124, 16, 1), varIsLoaded && varResults.summary.overallPassRate >= 50, RGBA(255, 140, 0, 1), RGBA(209, 52, 56, 1))

    lblGaugeSubtitle As label:
        X: =720
        Y: =250
        Width: =260
        Height: =30
        Text: =If(varIsLoaded, Text(varResults.summary.pass) & " of " & Text(varResults.summary.total) & " controls passing", "")
        Align: =Align.Center
        Size: =12
        Color: =RGBA(169, 169, 169, 1)

    rectGalProductsPlaceholder As rectangle:
        X: =20
        Y: =560
        Width: =800
        Height: =180
        Fill: =RGBA(245, 245, 245, 1)
        BorderColor: =RGBA(211, 211, 211, 1)
        BorderThickness: =1

    lblGalProductsHint As label:
        X: =30
        Y: =620
        Width: =780
        Height: =40
        Text: ="DELETE this rectangle and the hint label, then Insert a Blank Vertical Gallery here (see README Step 11)"
        Size: =11
        Color: =RGBA(169, 169, 169, 1)
        Align: =Align.Center

    btnNavControls As button:
        X: =1050
        Y: =10
        Width: =140
        Height: =40
        Text: ="Controls"
        Fill: =RGBA(0, 90, 158, 1)
        Color: =RGBA(255, 255, 255, 1)
        OnSelect: =Navigate(scrControls)

    btnNavChat As button:
        X: =1200
        Y: =10
        Width: =140
        Height: =40
        Text: ="Chat"
        Fill: =RGBA(0, 90, 158, 1)
        Color: =RGBA(255, 255, 255, 1)
        OnSelect: =Navigate(scrChat)

    btnClearResults As button:
        X: =830
        Y: =450
        Width: =170
        Height: =40
        Text: ="Clear Results"
        Fill: =RGBA(209, 52, 56, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =13
        Visible: =varIsLoaded
        OnSelect: |-
            =Set(varIsLoaded, false);
            Set(varResults, Blank());
            Set(varChatContext, Blank());
            Set(varExclusionContext, Blank());
            Clear(colProducts);
            Clear(colControls);
            Clear(colChatHistory);
            Clear(colFilteredControls);
            Clear(colBlobs);
            Reset(txtJsonInput);
            Notify("Results cleared — ready for new data", NotificationType.Information)
