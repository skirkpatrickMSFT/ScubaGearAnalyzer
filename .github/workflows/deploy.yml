# ============================================================
# ScubaGear Analyzer — Build & Deploy Azure Functions
#
# Builds the TypeScript project and deploys it to your Azure
# Function App. Can be triggered manually or on push to main.
#
# Prerequisites:
#   1. Azure Function App created (via Deploy to Azure button
#      or deploy-functions.ps1)
#   2. Repository secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE set
#      (download from Azure Portal → Function App → Get publish profile)
#      OR use AZURE_CREDENTIALS for service principal login
#   3. Repository variable AZURE_FUNCTIONAPP_NAME set to your
#      function app name (e.g. scubagear-func-dl45mgigo2pcw)
# ============================================================

name: Build & Deploy Functions

on:
  # Auto-deploy on push to main
  push:
    branches: [main]
    paths:
      - 'azure-functions/**'
      - '.github/workflows/deploy.yml'

  # Manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      function_app_name:
        description: 'Azure Function App name (overrides AZURE_FUNCTIONAPP_NAME variable)'
        required: false
        type: string

permissions:
  id-token: write   # Needed for OIDC login (optional)
  contents: read

env:
  NODE_VERSION: '22'
  AZURE_FUNCTIONAPP_NAME: ${{ inputs.function_app_name || vars.AZURE_FUNCTIONAPP_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # ── Checkout ────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup Node.js ───────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: azure-functions/package-lock.json

      # ── Install & Build ─────────────────────────────
      - name: Install dependencies
        working-directory: azure-functions
        run: npm ci

      - name: Build TypeScript
        working-directory: azure-functions
        run: npm run build

      # ── Package for deployment ──────────────────────
      # Only include what the function app needs at runtime
      - name: Create deployment package
        working-directory: azure-functions
        run: |
          mkdir -p ../deploy-package
          cp -r dist host.json package.json package-lock.json ../deploy-package/
          cd ../deploy-package
          npm ci --production
          zip -r ../deploy.zip .

      # ── Login to Azure ──────────────────────────────
      # Option 1: Publish Profile (simplest — no Azure AD setup)
      # Option 2: Service Principal (AZURE_CREDENTIALS secret)
      # Uncomment the approach you're using:

      # Option 2: Service Principal login
      # - name: Login to Azure
      #   uses: azure/login@v2
      #   with:
      #     creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Deploy to Function App ──────────────────────
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: deploy.zip
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

      # ── Post-deploy summary ─────────────────────────
      - name: Deployment summary
        run: |
          echo "## Deployment Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Function App | \`${{ env.AZURE_FUNCTIONAPP_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js | ${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Import the Power App from \`power-apps/\` into your Power Platform environment" >> $GITHUB_STEP_SUMMARY
          echo "2. Create a Custom Connector using \`azure-functions/openapi.json\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Connect the app to the connector with your function host key" >> $GITHUB_STEP_SUMMARY
